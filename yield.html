{% extends 'base.html' %}

{% block title %}उपज अनुमान - किसान सहायक{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
    <div class="col-md-8">
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-warning text-dark p-4 rounded-top-4">
                <h2 class="mb-0 fw-bold"><i class="fas fa-chart-bar me-2"></i> फसल उपज अनुमान (Crop Yield Prediction)</h2>
            </div>
            <div class="card-body p-4 p-md-5">
                <p class="text-muted mb-4">अपने खेत का क्षेत्रफल, बारिश, तापमान और खाद की मात्रा दर्ज़ करें।</p>
                
                <div class="text-center mb-4 voice-section">
                    <button class="btn btn-danger btn-lg voice-btn rounded-pill shadow-sm px-4 py-2 me-2" id="voiceBtn" type="button">
                        <i class="fas fa-microphone me-2"></i> बोलकर भरें (Voice)
                    </button>
                    <button class="btn btn-info btn-lg text-white rounded-pill shadow-sm px-4 py-2" id="weatherBtn" type="button">
                        <i class="fas fa-cloud-sun me-2"></i> मौसम भरें (Auto Weather)
                    </button>
                    <p class="mt-2 text-danger small d-none" id="recordingIndicator">रिकॉर्डिंग चल रही है... (Recording...)</p>
                    <div id="voiceTranscript" class="text-primary mt-2 fst-italic"></div>
                </div>

                <form id="predictionForm" data-endpoint="/api/predict/yield">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="area" class="form-label fw-bold">क्षेत्रफल (Area in Hectares)</label>
                            <input type="number" step="0.1" class="form-control form-control-lg bg-light" id="area" name="area" required placeholder="जैसे: 5.5">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="rainfall" class="form-label fw-bold">बारिश (Rainfall mm)</label>
                            <input type="number" step="0.1" class="form-control form-control-lg bg-light" id="rainfall" name="rainfall" required placeholder="जैसे: 250">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="temperature" class="form-label fw-bold">तापमान (Temperature °C)</label>
                            <input type="number" step="0.1" class="form-control form-control-lg bg-light" id="temperature" name="temperature" required placeholder="जैसे: 32">
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="fertilizer" class="form-label fw-bold">खाद की मात्रा (Fertilizer kg/ha)</label>
                            <input type="number" step="0.1" class="form-control form-control-lg bg-light" id="fertilizer" name="fertilizer" required placeholder="जैसे: 120">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold shadow-sm">
                        <i class="fas fa-calculator me-2"></i> उपज का अनुमान लगाएं (Predict Yield)
                    </button>
                </form>

                <div id="resultContainer" class="mt-5 d-none animate-slide-in">
                    <div id="reportContent">
                        <div class="alert alert-warning border-0 shadow-sm rounded-3 mb-4">
                            <h4 class="alert-heading fw-bold">अनुमानित उपज (Estimated Yield):</h4>
                            <p class="mb-0 fs-3 fw-bolder text-dark" id="predictionResult"></p>
                        </div>
                        <div class="card border-0 shadow-sm rounded-3">
                            <div class="card-body">
                                <canvas id="resultChart" style="max-height: 300px;"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-4">
                        <button class="btn btn-outline-success" id="downloadPdfBtn" type="button">
                            <i class="fas fa-file-pdf me-2"></i> रिपोर्ट डाउनलोड करें (Download PDF)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
